<script>/*CORE*/
const Core = (() => {
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, 12);
  const noon = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);
  // الأسبوع بيبدأ السبت
  const weekStart = d => { const x = noon(d); return addDays(x, -((x.getDay() + 1) % 7)); };
  const daysBetween = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);
  const periodKey = (freq, d) => {
    if (freq === 'daily') return ymd(d);
    if (freq === 'weekly') return 'w' + ymd(weekStart(d));
    if (freq === 'monthly') return d.getFullYear() + '-' + pad(d.getMonth() + 1);
    if (freq === 'yearly') return String(d.getFullYear());
    return 'once';
  };
  const prevPeriod = (freq, d) => {
    if (freq === 'daily') return addDays(d, -1);

    const over = ofType('task').filter(t => t.freq === 'once' && t.due && t.due < C.ymd(d) && !(t.done && t.done.once)).sort((a, b) => PRANK[prioOf(a)] - PRANK[prioOf(b)]);
    const dhabs = ofType('habit');
    const done = today.filter(t => C.isDone(t, d)).length;
    const p = today.length ? Math.round(done / today.length * 100) : 0;
    const act = C.activity(state, d, 14);
    const week = C.activity(state, d, 7).reduce((a, b) => a + b.n, 0);
    const certs = ofType('cert').filter(c => c.date && C.daysLeft(c.date, d) >= 0 && c.status !== 'passed').sort((a, b) => a.date < b.date ? -1 : 1);
    const near = certs[0];
    const cont = [...ofType('book').filter(b => b.status === 'reading'), ...ofType('playlist').filter(x => C.statusOf(x) === 'going'), ...ofType('movie').filter(m => m.status === 'want').slice(0, 4), ...ofType('book').filter(b => b.status === 'want').slice(0, 3)];
    const plans = ofType('plan').filter(x => x.status !== 'done' && x.date && C.daysLeft(x.date, d) >= 0 && C.daysLeft(x.date, d) <= 30).sort((a, b) => a.date < b.date ? -1 : 1).slice(0, 4);
    const nm = state.settings.name ? ' ' + esc(state.settings.name) : '';
    const heatCls = n => n >= 5 ? 'l3' : n >= 3 ? 'l2' : n >= 1 ? 'l1' : '';
    const favs = state.items.filter(i => i.fav && i.type !== 'task');
    return `<div class="banner"><h1>${greet}${nm} 👋</h1><div class="muted">${dfmt(C.ymd(d), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</div>
    <div class="acts2"><button class="btn pri" data-act="add" data-t="task">＋ مهمة</button><button class="btn" data-act="add" data-t="book">＋ كتاب</button><button class="btn" data-act="add" data-t="movie">＋ فيلم</button><button class="btn" data-act="add" data-t="plan">＋ خطة</button><button class="btn" data-act="add">＋ حاجة تانية</button></div>
    <div class="gs"><input type="search" id="gq" placeholder="🔎 دوّر في كل حاجة (مهام، كتب، شهادات، مصاريف، طلبات...)"></div><div id="gres"></div></div>
    ${recoveryBanner()}${bkBanner()}
    ${alertsBox(d)}
    ${goalsBox()}
    ${periodBox(d)}
    ${isDay ? `<div class="grid g4" style="margin-top:14px">
     <div class="box stat"><div class="ring" style="--p:${p}"><i>${p}%</i></div><div><div class="n" id="st-today">${done}/${today.length}</div><div class="muted">مهام النهارده</div></div></div>
     <div class="box stat"><div class="emo">⚡</div><div><div class="n" id="st-week">${week}</div><div class="muted">إنجازات آخر 7 أيام</div></div></div>
     <div class="box stat"><div class="emo">🔥</div><div><div class="n" id="st-streak">${C.maxStreak(state, d)}</div><div class="muted">أطول سلسلة التزام</div></div></div>
     <div class="box stat"><div class="emo">🎓</div><div><div class="n" id="st-exam">${near ? C.daysLeft(near.date, d) : '—'}</div><div class="muted">${near ? 'يوم على ' + esc(near.code || near.title) : 'مفيش امتحان قريب'}</div></div></div>
    </div>` : ''}
    ${over.length ? `<h2>⚠️ مهام متأخرة</h2><div class="box warn-b list">${over.map(t => taskRow(t, d)).join('')}</div>` : ''}
    ${isDay ? `<h2>✅ مهام النهارده <small><a href="#/tasks">الكل</a> · <a href="#/calendar">التقويم</a></small></h2>
    <div class="box list">${today.length ? today.slice().sort((a, b) => C.isDone(a, d) - C.isDone(b, d)).slice(0, 10).map(t => taskRow(t, d)).join('') : '<div class="empty"><b>🌿</b>مفيش مهام النهارده. أضف مهمة بزر +</div>'}</div>` : `<p class="muted"><a href="#/tasks" style="color:var(--ac)">✅ كل المهام</a></p>`}
    ${dhabs.length ? `<h2>🔁 العادات <small><a href="#/habits">الكل</a></small></h2><div class="box list">${dhabs.map(h => habitRow(h, d)).join('')}</div>` : ''}
    ${favs.length ? `<h2>⭐ المفضلة</h2><div class="shelf">${favs.map(it => miniCard(it)).join('')}</div>` : ''}
    ${cont.length ? `<h2>📖 كمّل من حيث وقفت</h2><div class="shelf">${cont.map(it => miniCard(it)).join('')}</div>` : ''}
    ${ofType('playlist').filter(x => C.statusOf(x) !== 'done').length ? `<h2>▶️ البلاي ليست <small><a href="#/learning">الكل</a></small></h2><div class="box list">${ofType('playlist').filter(x => C.statusOf(x) !== 'done').slice(0, 4).map(playRow).join('')}</div>` : ''}
    ${certs.length ? `<h2>🎓 العد التنازلي للامتحانات</h2><div class="grid g2">${certs.slice(0, 4).map(c => { const tp = C.topicsPerDay(c, d); return `<a class="box" href="#/item/${c.id}"><b>${esc(c.code || c.title)}</b> <span class="muted">${esc(c.title)}</span><div style="margin:6px 0">${bar(c)}</div><span class="muted">باقي ${C.daysLeft(c.date, d)} يوم · ${pct(c)}% ${tp ? '· ' + tp + ' موضوع/يوم' : ''}</span></a>`; }).join('')}</div>` : ''}
    ${plans.length ? `<h2>📅 قريب <small><a href="#/plans">الكل</a></small></h2><div class="box list">${plans.map(rowItem).join('')}</div>` : ''}
    <h2>📈 نشاطك آخر 14 يوم <small><a href="#/week">📊 مراجعة الأسبوع</a></small></h2><div class="box"><div class="heat">${act.map(a => `<i class="${heatCls(a.n)}" title="${a.d}: ${a.n}"></i>`).join('')}</div></div>
    ${state.items.length === 0 ? `<div class="box" style="margin-top:14px;text-align:center"><p>ابدأ فاضي أو جرّب بيانات تجريبية</p><button class="btn pri" data-act="demo">حمّل بيانات تجريبية</button></div>` : ''}`;
  }
  function playRow(it) {
    return `<div class="row"><div style="width:52px;flex:none">${coverEl(it, 'wide')}</div><div class="t"><a href="#/item/${it.id}">${esc(it.title)}</a><span class="muted">${sub(it)}</span><div style="margin-top:4px">${bar(it)}</div></div><button class="btn sm" data-act="bump" data-id="${it.id}" data-d="1">+1</button><button class="btn sm" data-act="bump" data-id="${it.id}" data-d="5">+5</button></div>`;
  }

  let tf = { freq: 'all', cat: 'all', q: '' }; let qaFreq = 'daily';
  function tasks() {
    const d = now(); const all = ofType('task');
    const cats = [...new Set(all.map(t => t.cat).filter(Boolean))];
    let list = all.filter(t => (tf.freq === 'all' || (tf.freq === 'today' ? C.showsToday(t, d) : t.freq === tf.freq)) && (tf.cat === 'all' || t.cat === tf.cat) && (!tf.q || t.title.toLowerCase().includes(tf.q.toLowerCase())));
    const chip = (k, v, l, cur) => `<button class="${cur === v ? 'on' : ''}" data-act="${k}" data-v="${v}">${l}</button>`;
    const groups = FREQ.map(([f, l]) => {
      const g = list.filter(t => t.freq === f); if (!g.length) return '';
      if (tf.sort === 'prio') g.sort((a, b) => PRANK[prioOf(a)] - PRANK[prioOf(b)]);
      const dn = g.filter(t => C.isDone(t, d)).length;
      return `<h2>${l} <small class="muted">${dn}/${g.length} (${Math.round(dn / g.length * 100)}%)</small></h2><div class="box list">${g.map(t => taskRow(t, d)).join('')}</div>`;
    }).join('');
    return `<div class="hrow"><h1>✅ المهام</h1></div>
    <div class="qa"><input id="qat" placeholder="＋ اكتب مهمة جديدة واضغط Enter" maxlength="200"><select id="qaf" aria-label="التكرار">${FREQ.map(([f, l]) => `<option value="${f}" ${f === qaFreq ? 'selected' : ''}>${l}</option>`).join('')}</select><button class="btn pri" data-act="qadd">إضافة</button></div>
    <div class="tool"><input type="search" id="tq" placeholder="ابحث في المهام" value="${esc(tf.q)}"></div>
    <div class="chips"><span class="muted" style="align-self:center">ترتيب:</span>${chip('tsort', 'def', 'الافتراضي', tf.sort || 'def')}${chip('tsort', 'prio', 'حسب الأولوية', tf.sort || 'def')}</div>
    <div class="chips">${chip('tfreq', 'all', 'الكل', tf.freq)}${chip('tfreq', 'today', 'النهارده', tf.freq)}${FREQ.map(([f, l]) => chip('tfreq', f, l, tf.freq)).join('')}</div>
    ${cats.length ? `<div class="chips">${chip('tcat', 'all', 'كل التصنيفات', tf.cat)}${cats.map(c => chip('tcat', c, esc(c), tf.cat)).join('')}</div>` : ''}
    ${groups || '<div class="empty"><b>📝</b>مفيش مهام هنا. اكتب مهمة في المربع اللي فوق واضغط «إضافة»</div>'}`;
  }

  let qs = {};
  function collection(types, title, icon) {
    const key = types.join('+');
    const sel = qs[key] && types.includes(qs[key].t) ? qs[key].t : types[0];
    const q = (qs[key] && qs[key].q) || ''; const st = (qs[key] && qs[key].st) || 'all'; const gsel = (qs[key] && qs[key].g) || 'all'; const psel = (qs[key] && qs[key].pl) || 'all';
    const type = sel; const view = viewOf(type);
    let items = ofType(type).filter(i => (!q || i.title.toLowerCase().includes(q.toLowerCase()) || (i.author || '').toLowerCase().includes(q.toLowerCase())) && (st === 'all' || C.statusOf(i) === st) && (gsel === 'all' || i.genre === gsel) && (psel === 'all' || i.platform === psel));
    if (type === 'plan' || type === 'cert') items.sort((a, b) => (a.date || '9') < (b.date || '9') ? -1 : 1); else items.reverse();
    const stl = STAT[type] || [];
    const body = !items.length ? `<div class="empty"><b>${T[type].icon}</b>مفيش ${T[type].plural} هنا لسه. اضغط + للإضافة</div>`
      : view === 'gallery' ? `<div class="gallery">${items.map(card).join('')}</div>`
      : view === 'table' ? tableView(items, type)
      : view === 'board' ? `<div class="board">${stl.map(([s, l]) => { const g = items.filter(i => C.statusOf(i) === s); return `<div class="col"><h3>${l} (${g.length})</h3>${g.map(i => `<a class="card" href="#/item/${i.id}">${coverEl(i)}<div class="meta"><div class="nm">${esc(i.title)}</div><div class="muted">${sub(i)}</div></div></a>`).join('') || '<div class="muted" style="padding:6px">فاضي</div>'}</div>`; }).join('')}</div>`
      : `<div class="box list">${items.map(rowItem).join('')}</div>`;
    return `<div class="hrow"><h1>${icon} ${title}</h1><button class="btn pri" data-act="add" data-t="${type}">＋ ${T[type].label} جديد</button></div>
    ${types.length > 1 ? `<div class="chips">${types.map(t => `<button class="${t === type ? 'on' : ''}" data-act="ctype" data-k="${key}" data-v="${t}">${T[t].icon} ${T[t].plural}</button>`).join('')}</div>` : ''}
    <div class="tool"><input type="search" id="cq" data-k="${key}" placeholder="بحث" value="${esc(q)}"><div class="seg">${[['gallery', '▦'], ['board', '☰'], ['list', '≡'], ['table', '▤']].map(([v, l]) => `<button class="${view === v ? 'on' : ''}" data-act="view" data-t="${type}" data-v="${v}" aria-label="${v}">${l}</button>`).join('')}</div></div>
    ${stl.length ? `<div class="chips"><button class="${st === 'all' ? 'on' : ''}" data-act="cst" data-k="${key}" data-v="all">الكل</button>${stl.map(([s, l]) => `<button class="${st === s ? 'on' : ''}" data-act="cst" data-k="${key}" data-v="${s}">${l}</button>`).join('')}</div>` : ''}
    ${['book', 'movie', 'cert', 'playlist'].includes(type) ? (() => { const gs = [...new Set(catList(catGroup(type)).concat(ofType(type).map(i => i.genre).filter(Boolean)))]; return gs.length ? `<div class="chips"><button class="${gsel === 'all' ? 'on' : ''}" data-act="cgn" data-k="${key}" data-v="all">كل الأنواع</button>${gs.map(g => `<button class="${gsel === g ? 'on' : ''}" data-act="cgn" data-k="${key}" data-v="${esc(g)}">${esc(g)}</button>`).join('')}</div>` : ''; })() : ''}
    ${['cert', 'playlist'].includes(type) ? (() => { const ps = [...new Set(catList('platform').concat(ofType(type).map(i => i.platform).filter(Boolean)))]; return `<div class="chips"><button class="${psel === 'all' ? 'on' : ''}" data-act="cpl" data-k="${key}" data-v="all">كل المنصات</button>${ps.map(g => `<button class="${psel === g ? 'on' : ''}" data-act="cpl" data-k="${key}" data-v="${esc(g)}">${esc(g)}</button>`).join('')}</div>`; })() : ''}
    ${body}<button class="fab" data-act="add" data-t="${type}" aria-label="إضافة">+</button>`;
  }

  function tableView(items, type) {
    const fs = T[type].fields.filter(f => !['isbn', 'url'].includes(f[0])).slice(0, 5);
    const cell = (it, f) => { const v = it[f[0]]; if (f[2] === 'select') { const o = (f[3] || []).find(x => String(x[0]) === String(v)); return esc(o ? o[1] : ''); } if (f[2] === 'date') return v ? dfmt(v) : ''; return esc(v == null ? '' : v); };
    return `<div class="tblw"><table class="tbl"><thead><tr><th>الاسم</th>${fs.map(f => `<th>${f[1]}</th>`).join('')}<th>التقدم</th></tr></thead><tbody>${items.map(it => `<tr class="lk" tabindex="0" role="link" data-href="#/item/${it.id}"><td><b>${it.fav ? '⭐ ' : ''}${esc(it.icon || T[type].icon)} ${esc(it.title)}</b></td>${fs.map(f => `<td>${cell(it, f)}</td>`).join('')}<td style="min-width:90px">${['book', 'playlist', 'cert'].includes(type) ? pct(it) + '%' + bar(it) : ''}</td></tr>`).join('')}</tbody></table></div>`;
  }
  const habitRow = (h, d) => {
    const done = C.isDone(h, d), st = C.streak(h, d);
    const last7 = h.freq === 'daily' ? `<span class="h7">${[6, 5, 4, 3, 2, 1, 0].map(n => `<i class="${C.isDone(h, C.addDays(d, -n)) ? 'on' : ''}"></i>`).join('')}</span>` : '';
    const fl = (HFREQ.find(f => f[0] === h.freq) || ['', h.freq])[1];
    return `<div class="row ${done ? 'done' : ''}"><button class="ck ${done ? 'on' : ''}" data-act="tick" data-id="${h.id}" aria-label="تم">${done ? '✓' : ''}</button><div class="t"><a href="#/item/${h.id}">${esc(h.title)}</a><span class="muted">${esc(fl)}${h.cat ? ' · ' + esc(h.cat) : ''}${st ? ' · 🔥 سلسلة ' + st : ''}</span></div>${last7}${rowActs(h.id)}</div>`;
  };

  let qhFreq = 'daily';
  function habits() {
    const d = now(); const all = ofType('habit');
    const groups = HFREQ.map(([f, l]) => {
      const g = all.filter(h => h.freq === f); if (!g.length) return '';
      const dn = g.filter(h => C.isDone(h, d)).length;
      return `<h2>${l} <small class="muted">${dn}/${g.length}</small></h2><div class="box list">${g.map(h => habitRow(h, d)).join('')}</div>`;
    }).join('');
    return `<div class="hrow"><h1>🔁 العادات</h1><button class="btn pri" data-act="add" data-t="habit">＋ عادة جديدة</button></div>
    <div class="qa"><input id="qah" placeholder="＋ اكتب عادة جديدة واضغط Enter" maxlength="200"><select id="qahf" aria-label="التكرار">${HFREQ.map(([f, l]) => `<option value="${f}" ${f === qhFreq ? 'selected' : ''}>${l}</option>`).join('')}</select><button class="btn pri" data-act="qhadd">إضافة</button></div>
    ${groups || '<div class="empty"><b>🔁</b>مفيش عادات لسه. اكتب عادة فوق أو اضغط +</div>'}`;
  }

  function week() {
    const d = now(); const ws = C.weekStart(d);
    const dnames = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    const days = []; for (let i = 0; i < 7; i++) { const dd = C.addDays(ws, i); days.push({ d: C.ymd(dd), n: state.log.filter(l => l.d === C.ymd(dd) && l.k !== 'p' && l.k !== 'b').length, future: C.daysBetween(noon2(d), dd) > 0 }); }
    const total = days.reduce((a, x) => a + x.n, 0);
    const focus = state.log.filter(l => l.k === 'p' && days.some(x => x.d === l.d)).reduce((s2, l) => s2 + (l.m || 25), 0);
    const best = days.reduce((m, x) => x.n > m.n ? x : m, days[0]);
    const bestName = best.n ? dnames[C.parse(best.d).getDay()] : '—';
    const maxv = Math.max(1, ...days.map(x => x.n));
    const dhs = ofType('habit').filter(h => h.freq === 'daily');
    const hdone = dhs.filter(h => state.log.some(l => l.id === h.id && days.some(x => x.d === l.d))).length;
    const streaks = state.items.filter(i => (i.type === 'task' || i.type === 'habit') && i.freq !== 'once').map(i => [C.streak(i, d), i]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, 5);
    return `<div class="hrow"><h1>📊 مراجعة الأسبوع</h1></div>
    <div class="muted">الأسبوع بيبدأ السبت ${dfmt(C.ymd(ws))}</div>
    <div class="grid g4" style="margin-top:10px">
     <div class="box stat"><div class="emo">✅</div><div><div class="n">${total}</div><div class="muted">إنجاز الأسبوع ده</div></div></div>
     <div class="box stat"><div class="emo">🏆</div><div><div class="n" style="font-size:18px">${bestName}</div><div class="muted">أكتر يوم نشاط (${best.n})</div></div></div>
     <div class="box stat"><div class="emo">⏱</div><div><div class="n">${Math.floor(focus / 60)}:${String(focus % 60).padStart(2, '0')}</div><div class="muted">ساعات مذاكرة</div></div></div>
     <div class="box stat"><div class="emo">🔁</div><div><div class="n">${hdone}/${dhs.length}</div><div class="muted">عادات يومية اتعملت</div></div></div>
    </div>
    <h2>📈 نشاط كل يوم</h2><div class="box"><div class="wbars">${days.map(x => `<div class="c"><div class="b" style="height:${Math.round(x.n / maxv * 100)}%;${x.future ? 'opacity:.25' : ''}" title="${x.d}: ${x.n}"></div><div class="lb">${dnames[C.parse(x.d).getDay()]}</div></div>`).join('')}</div></div>
    <h2>🔥 السلاسل الحالية</h2><div class="box list">${streaks.length ? streaks.map(([n, i]) => `<a class="row" href="#/item/${i.id}"><div class="t"><b>${esc(i.title)}</b><span class="muted">${i.type === 'habit' ? 'عادة' : 'مهمة'}</span></div><span class="chip warn">🔥 ${n}</span></a>`).join('') : '<div class="empty"><b>🌱</b>لسه مفيش سلاسل. علّم عادة أو مهمة النهارده</div>'}</div>`;
  }
  const noon2 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);

  // ---------- calendar ----------
  let cal = { y: null, m: null, sel: null };
  const KC = { plan: '#2383e2', cert: '#e03e3e', task: '#d9730d', book: '#0f9d58', movie: '#9b59b6', habit: '#40c463' };
  function calItems() {
    const out = [];
    state.items.forEach(it => {
      if (it.type === 'plan' && it.date) out.push([it.date, it]);
      if (it.type === 'cert' && it.date) out.push([it.date, it]);
      if (it.type === 'task' && it.freq === 'once' && it.due) out.push([it.due, it]);
      if (it.type === 'habit' && it.freq === 'daily' && it.done) Object.keys(it.done).forEach(k => out.push([k, it]));
    });
    return out;
  }
  function calendar() {
    const d = now(); if (cal.y == null) { cal.y = d.getFullYear(); cal.m = d.getMonth(); cal.sel = C.ymd(d); }
    const first = new Date(cal.y, cal.m, 1, 12); const start = C.weekStart(first);
    const its = calItems(); const today = C.ymd(d);
    const names = ['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];
    let cells = '';
    for (let i = 0; i < 42; i++) {
      const dd = C.addDays(start, i); const k = C.ymd(dd); const here = its.filter(x => x[0] === k);
      if (i >= 35 && dd.getMonth() !== cal.m) break;
      cells += `<button class="dy ${dd.getMonth() !== cal.m ? 'out' : ''} ${k === today ? 'td' : ''} ${k === cal.sel ? 'sel' : ''}" data-act="calsel" data-v="${k}">${dd.getDate()}<span class="dots">${here.slice(0, 4).map(x => `<i style="background:${KC[x[1].type]}"></i>`).join('')}</span></button>`;
    }
    const sel = its.filter(x => x[0] === cal.sel && x[1].type !== 'habit').map(x => x[1]);
    const dh2 = ofType('habit').filter(h => h.freq === 'daily');
